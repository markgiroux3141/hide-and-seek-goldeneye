[package]
name = "game"
version = "0.1.0"
edition = "2021"

# BUILD & HIDE — the game. Owns the authored world, weapons, enemy/player
# controllers, and the winit event loop; consumes `engine` as a library
# (one-way dependency). `src/lib.rs` is the crate; the bin is a thin launcher.
#
# `default-run` so a bare `cargo run` launches the game. Without it cargo refuses
# to choose between this and the `strip_hands` asset tool in `src/bin/`.
default-run = "build-and-hide"

[[bin]]
name = "build-and-hide"
path = "src/main.rs"

[dependencies]
engine = { workspace = true }
csg = { workspace = true }
glam = { workspace = true }
winit = { workspace = true }
pollster = { workspace = true }
rapier3d = { workspace = true }
# Entity-component storage — the game's `ecs` module (components + systems).
hecs = { workspace = true }
image = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# egui UI: the Context (builds the shop/inventory panels) + egui-winit (translates
# winit events into egui input). The painter (egui-wgpu) lives in the engine.
egui = { workspace = true }
egui-winit = { workspace = true }

[dev-dependencies]
# Used by the gun_strip tests to re-walk a stripped GLB through the SAME glTF
# crate the engine loader uses, verifying the hand geometry no longer loads.
gltf = { workspace = true }
