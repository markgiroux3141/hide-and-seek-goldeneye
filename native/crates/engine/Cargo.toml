[package]
name = "engine"
version = "0.1.0"
edition = "2021"

# Domain-agnostic runtime: renderer (wgpu), windowing (winit), CSG runtime,
# resource/asset load (gltf), physics wrapper (rapier3d). Knows nothing about
# hide-and-seek. One-way boundary: engine never references `game`.
[dependencies]
csg = { workspace = true }
glam = { workspace = true }
winit = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }
gltf = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
rapier3d = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
kira = { workspace = true }
gilrs = { workspace = true }
# egui painter (render layer): tessellated UI → wgpu draw calls. The game app owns
# the egui Context + winit event translation; the engine just paints its output.
egui = { workspace = true }
egui-wgpu = { workspace = true }

[dev-dependencies]
# WGSL front-end (same major as our wgpu, so it is the very validator wgpu runs at
# `create_shader_module`). Used by the shader test: a typo in a .wgsl otherwise
# surfaces as a panic on launch, which no CPU-side test would catch.
naga = { version = "24", features = ["wgsl-in"] }
