# BUILD & HIDE — native Rust engine port.
# See ../ENGINE_PORT_PLAN.md. The JS game (../src) stays as the design spec /
# behavioral regression oracle; nothing here deletes or depends on it.
[workspace]
resolver = "2"
members = ["crates/csg", "crates/engine", "crates/game"]

# Locked stack — pinned once here, consumed by member crates via `workspace = true`.
# Versions chosen for the Rust 1.92 toolchain (late-2025 ecosystem).
[workspace.dependencies]
glam = "0.29"
winit = "0.30"
wgpu = "24"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
gltf = { version = "1.4", features = ["import", "utils"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["bmp", "png", "jpeg"] }
rapier3d = "0.22"
env_logger = "0.11"
log = "0.4"
# Game-audio (kira): sound handles, per-instance volume, looping music, mixing;
# decodes wav (SFX) + mp3 (music) via symphonia. Default features already include
# the cpal backend + wav + mp3, so no feature list is needed.
kira = "0.12"
# Entity-component storage (hecs): a fast, minimal archetypal ECS — storage +
# queries only, no scheduler/app-model, so it embeds cleanly into our bespoke
# fixed-step loop. Lives in the `game` crate (all components are game-domain);
# the `engine` toolkit stays entity-free. See crates/game/src/ecs/.
hecs = "0.11"
# Gamepad input (gilrs): cross-platform pad enumeration + button/axis events, used
# to wire the USB N64 controller (GoldenEye "solitaire" scheme). Windows backend is
# XInput-based — see crates/engine/src/platform/gamepad.rs for the mapping caveat.
gilrs = "0.11"
# Immediate-mode UI (egui) for in-game menus — the shop + inventory panels. 0.31
# is the release that targets wgpu 24 + winit 0.30 (our locked stack). `egui` +
# `egui-wgpu` (the painter) live in the engine's render layer; `egui-winit` (event
# translation) lives in the game app alongside the winit loop. The in-world HUD
# (ammo/health/credits) stays on the bitmap font — egui is menus only.
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"

# Local crates.
csg = { path = "crates/csg" }
engine = { path = "crates/engine" }

# Day-to-day test / handoff build (what `cargo build --release` produces).
# opt-level 3 keeps the game smooth to play; dropping fat LTO and raising
# codegen-units cuts most of the compile+link time. `incremental` lets small
# edits relink instead of rebuilding from scratch. For a true max-perf ship
# build use `--profile release-dist` below.
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
incremental = true

# Maximum-runtime-perf distribution build (slow to compile — fat LTO, single
# codegen unit). Only needed for a real shippable artifact, not for iterating.
[profile.release-dist]
inherits = "release"
lto = true
codegen-units = 1
incremental = false

# Debug builds: keep OUR crates cheap to rebuild (opt-level 0, the default) but
# optimize DEPENDENCIES once and cache them, so physics/render aren't unusably
# slow when running an unoptimized debug build (e.g. the levelgen harness).
[profile.dev.package."*"]
opt-level = 3
